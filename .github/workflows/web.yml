name: Kiểm thử và triển khai Web

on:
  push:
  pull_request:

jobs:
  kiem-thu:
    name: Phân tích và kiểm thử
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true

      - run: flutter --version
      - run: flutter pub get --enforce-lockfile

      # `--fatal-infos` để một cảnh báo nhỏ cũng làm đỏ CI. Nghiêm khắc từ
      # đầu thì cảnh báo không kịp tích tụ thành hàng trăm dòng ai cũng lờ đi.
      - run: flutter analyze --fatal-infos

      - run: flutter test --reporter expanded

  backend:
    name: Kiểm thử backend và hợp đồng
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: blockchain/package-lock.json
      - run: npm ci
        working-directory: blockchain
      - run: node --test --test-concurrency=2 server/*.test.mjs
      - run: npm test
        working-directory: blockchain

  trien-khai:
    name: Dựng và đưa lên GitHub Pages
    needs: [kiem-thu, backend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true

      - run: flutter pub get --enforce-lockfile

      # GitHub Pages phục vụ dự án ở đường dẫn con /<tên-kho>/, nên phải khai
      # `--base-href`. Thiếu dòng này là trang trắng và console báo không tải
      # được main.dart.js — lỗi hay gặp nhất khi triển khai Flutter web.
      - name: Dựng bản phát hành
        run: flutter build web --no-pub --release --base-href "/${{ github.event.repository.name }}/"

      # GitHub Pages không có cơ chế rewrite. Chép index.html thành 404.html
      # để tải lại một trang con (ví dụ /khoa-hoc/dart-co-ban) không ra lỗi
      # 404 — đây là cái giá của điều hướng phía trình duyệt.
      - name: Thêm 404.html cho điều hướng phía trình duyệt
        run: cp build/web/index.html build/web/404.html

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - uses: actions/deploy-pages@v4
