include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    avoid_print: warning
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_locals
    - avoid_relative_lib_imports
